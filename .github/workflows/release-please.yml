name: Release Please

# Reads Conventional Commits on the default branch and opens/updates a
# release PR with bumped version + generated CHANGELOG. Merging that PR
# tags the release and (optionally) publishes artifacts.
#
# Two-tier repos: this runs on `main` only — `develop` → `main` merges
# are what drive releases. Trunk-only repos: same, just on `main`.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Config + manifest live alongside this workflow.
          # Edit .github/release-please-config.json to change the release type
          # (default: "simple" — no language-specific packaging step).
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
