name: Publish the 1.x tombstone

# ─────────────────────────────────────────────────────────────────────
# THIS IS NOT main's PUBLISH WORKFLOW.
#
# `main` has a file at this same path that releases 2.x through
# release-please. This one publishes the frozen 1.3.2 tombstone from
# `legacy/1.x`, once, by hand. They share a filename because they have
# to: npm's trusted publisher for this package names the workflow
# `publish.yml`, and npm validates the filename of the workflow that
# actually calls it. A `publish-legacy.yml` would not be authorised.
#
# The two are told apart by ref, not by name. Dispatching this means
# picking `legacy/1.x` in the "Use workflow from" selector, or:
#
#     gh workflow run publish.yml --ref legacy/1.x
#
# The first thing the job does is verify it is on that ref, so running
# it from anywhere else fails immediately rather than doing something
# surprising.
#
# WHY THERE IS NO AUTOMATIC TRIGGER
#
# No `push`. Merging into `legacy/1.x` must not publish. There is
# exactly one version this branch will ever ship, a published version
# is spent permanently, and the person deciding to spend it should be a
# person. release-please is not involved and never will be: it watches
# `main`, and a second manifest here would fight it over the tag
# namespace.
#
# WHY THE DIST-TAG MATTERS MORE THAN USUAL
#
# `npm publish` moves `latest` to whatever was published most recently,
# with no regard for semver ordering. Publishing 1.3.2 as `latest`
# would point every `npm install astrologyjs` at the tombstone and
# effectively unpublish 2.x. `--tag legacy` avoids that, and the job
# asserts `latest` is untouched afterwards rather than assuming it.
#
# Dist-tags do not affect range resolution, so the people this release
# is for — the ones with `^1.3.1` in a package.json — still resolve to
# 1.3.2 and still get the notice.
# ─────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish astrologyjs@1.3.2 under the legacy tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'morphatic/astrologyjs'
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # Without it npm falls back to looking for a token and fails ENEEDAUTH,
      # which reads like a missing credential rather than a missing permission.
      id-token: write
    steps:
      - name: Refuse to run from any ref but legacy/1.x
        run: |
          if [ "$GITHUB_REF" != "refs/heads/legacy/1.x" ]; then
            echo "::error::This workflow publishes the 1.x tombstone and must be dispatched from legacy/1.x. Got $GITHUB_REF."
            echo "::error::To release 2.x, dispatch publish.yml from main instead — it is a different file at the same path."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Pinned; see the note in ci.yml.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # npm's trusted publishing requires Node 22.14.0 or later.
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.x,
      # which ignores OIDC entirely and fails looking for a token.
      - name: Upgrade npm to a version that supports OIDC
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) (trusted publishing needs >= 11.5.1)"

      - name: Refuse anything that is not a 1.x version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            1.*) echo "Version $VERSION is on the 1.x line; proceeding." ;;
            *)   echo "::error::Refusing to publish $VERSION from the legacy branch. This workflow only ships 1.x."
                 exit 1 ;;
          esac

      - name: Refuse to republish a version that already exists
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if OUTPUT="$(npm view "astrologyjs@$VERSION" version 2>&1)"; then
            echo "::error::astrologyjs@$VERSION is already on the registry; a published version cannot be replaced."
            exit 1
          elif ! grep -qi "E404\|404 Not Found" <<< "$OUTPUT"; then
            # An outage must not be mistaken for "not published".
            echo "::error::Could not reach the registry to check astrologyjs@$VERSION."
            echo "$OUTPUT"
            exit 1
          fi
          echo "astrologyjs@$VERSION is unpublished; proceeding."

      - name: Record which version `latest` points at
        id: before
        run: |
          set -euo pipefail
          LATEST="$(npm view astrologyjs dist-tags.latest)"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "latest is currently $LATEST; it must still be $LATEST when this finishes."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Builds as a side effect, so the artifacts published below are the ones
      # the dist assertions ran against.
      - name: Test
        run: pnpm test

      - name: Verify the build produced what package.json promises
        run: |
          set -euo pipefail
          for f in dist/astrologyjs.js dist/astrologyjs.min.js dist/astrologyjs-es6.js dist/astrologyjs.d.ts; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
          echo "Files that will be published:"
          npm pack --dry-run

      # Installing the tarball the way one of the affected users would. The
      # whole release is a message, so the check is that the message arrives —
      # a package that installs and then fails some other way would be 1.x's
      # original sin repeated.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$TARBALL"
          node -e "
            const { ChartFactory, Person, RETIREMENT_NOTICE } = require('astrologyjs');
            if (!/no longer works/.test(RETIREMENT_NOTICE)) {
              throw new Error('RETIREMENT_NOTICE did not survive the build');
            }
            let sync;
            try { new Person('x', 'y', {}); } catch (e) { sync = e; }
            if (!sync || sync.code !== 'ASTROLOGYJS_1X_RETIRED') {
              throw new Error('Person did not throw the retirement error');
            }
            ChartFactory.create('smoke', null).then(
              () => { throw new Error('ChartFactory.create resolved; it must reject'); },
              (e) => {
                if (e.code !== 'ASTROLOGYJS_1X_RETIRED') throw e;
                console.log('Installed tombstone reports itself correctly.');
              },
            );
          "

      # No token and no --provenance flag: npm detects the OIDC environment on
      # its own. `--tag legacy` is the load-bearing argument here.
      - name: Publish under the legacy tag
        run: npm publish --access public --tag legacy

      - name: Verify `latest` still points at 2.x
        run: |
          set -euo pipefail
          BEFORE="${{ steps.before.outputs.latest }}"
          AFTER="$(npm view astrologyjs dist-tags.latest)"
          LEGACY="$(npm view astrologyjs dist-tags.legacy)"
          echo "latest: $BEFORE -> $AFTER"
          echo "legacy: $LEGACY"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::Publishing moved latest from $BEFORE to $AFTER. Fix immediately with: npm dist-tag add astrologyjs@$BEFORE latest"
            exit 1
          fi

      - name: Summary
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`astrologyjs@$VERSION\` under the \`legacy\` tag"
            echo
            echo "- <https://www.npmjs.com/package/astrologyjs/v/$VERSION>"
            echo "- \`latest\` still points at \`${{ steps.before.outputs.latest }}\`."
            echo "- Anyone resolving \`^1.3.1\` now gets the retirement notice instead of \`Unexpected token <\`."
          } >> "$GITHUB_STEP_SUMMARY"
