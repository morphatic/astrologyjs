name: Release and publish

# ─────────────────────────────────────────────────────────────────────
# The whole release pipeline, in one file: release-please proposes the
# version bump and changelog, and merging its PR publishes to npm.
#
# Publishing uses npm trusted publishing (OIDC). There is no NPM_TOKEN —
# npm authenticates this workflow against a trusted publisher configured
# on npmjs.com, so nothing expires, rotates, or leaks, and provenance
# attestations are attached automatically.
#
# WHY ONE FILE
#
# release-please creates the tag and the GitHub release using the default
# GITHUB_TOKEN, and GitHub deliberately does not start new workflow runs
# from GITHUB_TOKEN events. A separate publish workflow listening on
# `push: tags` or `release: published` would therefore never fire, and
# would fail silently — no red run, just nothing happening on release
# day. Keeping both jobs here lets the publish depend on release-please's
# own `release_created` output, which is a fact rather than an inference.
#
# Splitting them back out would also break authentication: npm validates
# the CALLING workflow's filename, so a reusable workflow invoked from
# here would be checked against this file's name, not its own.
#
# SETUP ON NPMJS.COM, ONCE
#
#   Package:      astrologyjs
#   Organization: morphatic
#   Repository:   astrologyjs
#   Workflow:     publish.yml      <- renaming this file breaks releases
#   Environment:  (blank, unless the optional gate below is used)
#   Allowed:      tick `npm publish`
#
# Configurations created after 2026-05-20 require at least one allowed
# action, so an untouched `Allowed actions` is a publish failure.
#
# DO NOT SET separate-pull-requests BACK TO false
#
# It looks redundant for a single-package repo, and it is not. With it
# false, release-please's Merge plugin rebuilds the release PR on a
# branch with no component segment, and `buildRelease` then refuses to
# create the release because that branch component does not match the
# one derived from package.json. It fails silently: green run, version
# bumped, no tag, no publish. That wedged 2.0.0 and 2.0.1. See "If a
# release wedges" in CLAUDE.md.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  # Recovery hatch: if a release was tagged but the publish failed, fix
  # forward and re-run this rather than publishing from a laptop.
  workflow_dispatch:

# Never let two releases race. Not cancel-in-progress: interrupting a run
# mid-`npm publish` is exactly when partial state would be worst.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  release:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks must never release or publish under this repo's identity.
    if: github.repository == 'morphatic/astrologyjs'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # Singular `release_created` is the root-component output. The
      # plural `releases_created` is the across-all-packages one; for a
      # single-package manifest they agree, but the singular is the
      # documented gate and stays correct if this ever grows components.
      release-created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Report what happened
        run: |
          if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
            echo "::notice::Released ${{ steps.release.outputs.tag_name }} — publishing."
          else
            echo "::notice::No release this run. Either the release PR was updated, or nothing releasable landed."
          fi

  publish:
    name: Publish to npm
    needs: release
    # The primary path is release-please saying it cut a release. The
    # manual path exists for recovery and is guarded below on its own.
    if: needs.release.outputs.release-created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish
      # rights. Without it the publish falls back to looking for a token
      # and fails with ENEEDAUTH, which reads like a missing credential.
      id-token: write
    # Optional approval gate. Create an `npm-publish` environment with
    # required reviewers, uncomment, and set the same environment name on
    # the trusted publisher — npm matches it, so configuring it in only
    # one of the two places fails the publish.
    # environment: npm-publish
    steps:
      - uses: actions/checkout@v7

      # Pinned, as in ci.yml and audit.yml. The action has no default: with no
      # `version` here and no `packageManager` field in package.json it fails
      # with "No pnpm version is specified" before installing anything.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # npm's trusted publishing requires Node 22.14.0 or later.
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI 11.5.1 or later; Node 22 ships
      # npm 10.x, which ignores OIDC entirely and fails looking for a
      # token. This is the step whose absence produces the confusing
      # "works locally, ENEEDAUTH in CI" failure.
      - name: Upgrade npm to a version that supports OIDC
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) (trusted publishing needs >= 11.5.1)"

      # npm refuses to republish a version, so hitting that would fail at
      # the very last step. Checking first turns it into a clear message,
      # and makes a manual re-run safe rather than a coin flip.
      - name: Refuse to republish a version that already exists
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if OUTPUT="$(npm view "astrologyjs@$VERSION" version 2>&1)"; then
            echo "::error::astrologyjs@$VERSION is already on the registry; a published version cannot be replaced. Land a new release instead."
            exit 1
          elif ! grep -qi "E404\|404 Not Found" <<< "$OUTPUT"; then
            # An outage must not be mistaken for "not published".
            echo "::error::Could not reach the registry to check astrologyjs@$VERSION."
            echo "$OUTPUT"
            exit 1
          fi
          echo "astrologyjs@$VERSION is unpublished; proceeding."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, not a subset. This is the last point at which a
      # broken release can be stopped for free; after `npm publish` a
      # version number is spent permanently.
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the build produced what package.json promises
        run: |
          set -euo pipefail
          for f in dist/index.js dist/index.d.ts; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
          echo "Files that will be published:"
          npm pack --dry-run

      # Installing the tarball the way a user would. 1.x's defining
      # failure was a package that resolved but did not work, so "it
      # built" is not the bar — an exports map or a `files` list can be
      # wrong in ways nothing above this line would notice.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$TARBALL"
          node --input-type=module -e "
            import { createChart, createPerson, configure, ASPECTS, AstrologyError } from 'astrologyjs';
            const missing = Object.entries({ createChart, createPerson, configure, AstrologyError })
              .filter(([, v]) => typeof v !== 'function')
              .map(([k]) => k);
            if (missing.length) throw new Error('Not exported as functions: ' + missing.join(', '));
            if (!Array.isArray(ASPECTS) || ASPECTS.length !== 21) {
              throw new Error('ASPECTS did not survive the build');
            }
            console.log('Installed package imports cleanly, ' + ASPECTS.length + ' aspects.');
          "

      # No token, and no --provenance flag: npm detects the OIDC
      # environment on its own and attaches provenance automatically.
      - name: Publish
        run: npm publish --access public

      - name: Summary
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`astrologyjs@$VERSION\`"
            echo
            echo "- <https://www.npmjs.com/package/astrologyjs/v/$VERSION>"
            echo "- Provenance attached automatically via trusted publishing (OIDC)."
          } >> "$GITHUB_STEP_SUMMARY"
